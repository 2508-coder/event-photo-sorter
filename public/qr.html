<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Event QR Generator</title>
<style>
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(900px 600px at 50% -10%,#14241b,#0a130e 60%);color:#eef3ec;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
 .box{background:#11201a;border:1px solid #284036;border-radius:18px;padding:26px;width:380px;max-width:92%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
 .brand-logo{display:block;width:72px;height:72px;object-fit:contain;margin:0 auto 8px;background:#fff;border-radius:16px;padding:8px}
 h2{margin:0 0 4px} p{color:#96a99c;font-size:13px;margin:6px 0 14px}
 input{width:100%;padding:11px;border-radius:9px;border:1px solid #284036;background:#15271e;color:#fff;margin-bottom:12px}
 button{padding:11px 18px;border:none;border-radius:9px;background:linear-gradient(135deg,#1fbf75,#e8b54a);color:#08130d;font-weight:700;cursor:pointer}
 #qr{margin:18px auto 6px;background:#fff;padding:14px;border-radius:14px;display:inline-block;min-height:10px}
 #qr img{display:block;width:300px;height:300px}
 a.dl{display:none;margin-top:10px;color:#e8b54a;text-decoration:none;font-weight:600}
 .err{color:#ff9a9a;font-size:13px}
</style></head>
<body><div class="box">
 <img src="/logo.png" class="brand-logo" alt="logo" onerror="this.style.display='none'"/>
 <h2>📸 Event QR Code</h2>
 <p>Paste your deployed guest link (ends with <b>/guest.html</b>) to make a QR for your banner.</p>
 <input id="url" placeholder="https://your-site.vercel.app/guest.html" />
 <button onclick="gen()">Generate QR</button>
 <div id="qr"></div>
 <a id="dl" class="dl" download="event-qr.png">⬇️ Download QR (PNG)</a>
 <script>
 function gen(){
   var u=document.getElementById('url').value.trim();
   var box=document.getElementById('qr');
   if(!u){ box.innerHTML='<span class="err">Enter a link first.</span>'; return; }
   box.innerHTML='Generating…';
   var api='https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=16&data='+encodeURIComponent(u);
   var img=new Image();
   img.onload=function(){
     box.innerHTML=''; box.appendChild(img);
     var d=document.getElementById('dl'); d.href=api; d.style.display='inline-block';
   };
   img.onerror=function(){ box.innerHTML='<span class="err">Could not reach the QR service — check your internet and try again.</span>'; };
   img.src=api;
 }
 // download as a real PNG file (falls back to opening the image if blocked)
 document.getElementById('dl').addEventListener('click', async function(e){
   var api=this.href;
   try{ e.preventDefault(); var r=await fetch(api); var b=await r.blob(); var url=URL.createObjectURL(b);
     var a=document.createElement('a'); a.href=url; a.download='event-qr.png'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
   }catch(_){ window.open(api,'_blank'); }
 });
 </script>
</div></body></html>
